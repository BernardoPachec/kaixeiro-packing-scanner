<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#000000" />
<title>Kaixeiro · Scanner Full</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="full-pdf.js"></script>
<script src="full-ml.js"></script>
<style>
  /* Identidade Kaixeiro: preto, amarelo #F3AA07 e branco. Verde e vermelho só como sinal
     de status (confere / não confere), conforme o protótipo do Claude Design. */
  :root{
    --bg:#000; --s1:#0A0A0A; --s2:#111; --s3:#161616; --s4:#1A1A1A;
    --line:#262626; --line2:#333; --txt:#fff; --muted:#9a9a9a; --dim:#6b6b6b;
    --y:#F3AA07; --y2:#FFD04A; --ok:#3ecf6e; --okbg:#0b2415; --bad:#ff5a5a; --badtxt:#ff6b6b; --badbg:#2a0d0d;
    --fh:"Barlow Condensed",system-ui,sans-serif; --fb:"Barlow",system-ui,sans-serif;
    --mono:ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--fb);font-size:15px;line-height:1.45}
  a{color:var(--y);text-decoration:none} a:hover{color:var(--y2)}
  button{font-family:inherit}
  .hidden{display:none !important}
  .mono{font-family:var(--mono)}
  .eyebrow{font:500 13px var(--fh);letter-spacing:.2em;text-transform:uppercase;color:var(--y)}
  .h1{margin:0;font:600 44px/1 var(--fh);text-transform:uppercase;letter-spacing:.01em}
  .sub{margin:0;color:var(--muted);font-size:15px}
  .lbl{font:500 12px var(--fh);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

  header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 24px;border-bottom:1px solid var(--line);background:#000;position:sticky;top:0;z-index:5;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px;cursor:pointer}
  .brand svg{height:34px;width:auto;display:block}
  .brand span{font:500 11px/1 var(--fh);letter-spacing:.2em;text-transform:uppercase;color:var(--y)}
  nav.crumb{display:flex;align-items:center;gap:8px;font:500 14px var(--fh);letter-spacing:.06em;text-transform:uppercase;flex-wrap:wrap}
  nav.crumb a{color:var(--muted)} nav.crumb a:hover{color:#fff} nav.crumb .sep{color:#444} nav.crumb .cur{color:#fff}
  .back-app{font:500 13px var(--fh);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line2);padding:7px 12px}
  .back-app:hover{color:#fff;border-color:#555}

  main{width:100%;max-width:1280px;margin:0 auto;padding:32px 24px 72px;display:flex;flex-direction:column;gap:24px}
  main.narrow{max-width:720px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .head > div{display:flex;flex-direction:column;gap:6px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border:1px solid var(--y);background:var(--y);color:#000;font:600 14px var(--fh);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
  .btn:hover{background:var(--y2)}
  .btn.ghost{background:transparent;color:var(--y)} .btn.ghost:hover{background:var(--s4)}
  .btn.white{background:transparent;color:#fff;border-color:#fff} .btn.white:hover{background:var(--s4)}
  .btn.quiet{background:transparent;color:var(--muted);border-color:var(--line2)} .btn.quiet:hover{color:#fff;border-color:#555}
  .btn.sm{height:36px;padding:0 12px;font-size:12px}
  .btn:disabled{opacity:.45;cursor:default}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));border:1px solid var(--line)}
  .kpis > div{padding:18px 22px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
  .kpis b{font:600 40px/1 var(--fh)}
  .kpis span{font-size:13px;color:var(--muted)}

  .tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .search{flex:1 1 260px;max-width:420px;display:flex;align-items:center;gap:10px;border:1px solid var(--line2);padding:0 14px;height:44px}
  .search input{flex:1;background:transparent;border:0;outline:0;color:#fff;font:15px var(--fb);min-width:0}
  input::placeholder{color:var(--dim)}
  .seg{display:flex;border:1px solid var(--line2)}
  .seg button{background:transparent;color:#cfcfcf;border:0;padding:0 16px;height:42px;font:500 14px var(--fh);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
  .seg button.on{background:var(--y);color:#000}

  .table{border:1px solid var(--line);display:flex;flex-direction:column}
  .thead,.trow{display:grid;gap:16px;align-items:center;padding:14px 22px}
  .thead{border-bottom:1px solid var(--line)}
  .trow{border-bottom:1px solid #1c1c1c;cursor:pointer;padding:20px 22px}
  .trow:hover{background:var(--s2)}
  .g-env{grid-template-columns:minmax(0,1.3fr) minmax(0,.8fr) minmax(0,1.3fr) minmax(0,1.2fr) minmax(0,.8fr) 140px}
  .g-itm{grid-template-columns:minmax(0,2.6fr) minmax(0,.8fr) minmax(0,1.3fr) minmax(0,.9fr) 28px}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .bar{height:4px;background:#222} .bar > i{display:block;height:100%;background:var(--y)}
  .flag{font:600 10px/1.3 var(--fh);letter-spacing:.08em;text-transform:uppercase;color:var(--badtxt);border:1px solid #5c2323;padding:3px 7px;white-space:nowrap}
  .flag-y{color:var(--y);border-color:#5a4210}
  .filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .fchip{height:38px;padding:0 14px;background:#000;border:1px solid var(--line2);color:#cfcfcf;font:600 13px var(--fh);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
  .fchip:hover{border-color:#555;color:#fff}
  .fchip.on{background:var(--y);border-color:var(--y);color:#000}
  .chip.w{border-color:#fff;color:#fff}
  .mini.w:hover{color:#fff}
  .mini{background:transparent;border:0;color:var(--dim);font:500 12px var(--fb);cursor:pointer;padding:2px 0;text-decoration:underline;text-underline-offset:3px}
  .mini:hover{color:var(--badtxt)}
  .mini.y:hover{color:var(--y)}
  .trow.alerta{background:rgba(243,170,7,.08);box-shadow:inset 4px 0 0 var(--y)}
  .trow.alerta:hover{background:rgba(243,170,7,.13)}
  .alerta-box{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--y);background:rgba(243,170,7,.08);color:var(--y);padding:10px 12px;font-size:14px;line-height:1.4}
  .alerta-box b{font-family:var(--fh);letter-spacing:.08em;text-transform:uppercase}
  .chip{font:600 11px var(--fh);letter-spacing:.08em;border:1px solid var(--line2);padding:2px 7px;color:#bdbdbd;white-space:nowrap}
  .chip.y{border-color:#5a4210;color:var(--y)}
  .st{font:500 13px var(--fh);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
  .cta{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border:1px solid var(--y);font:600 13px var(--fh);letter-spacing:.1em;text-transform:uppercase;justify-self:end}
  .thumb{flex:none;width:72px;height:72px;border:1px solid var(--line2);background:#fff center/contain no-repeat}
  .thumb.ph{background:repeating-linear-gradient(135deg,#111 0 8px,#161616 8px 16px);display:flex;align-items:center;justify-content:center;font:9px var(--mono);color:var(--dim)}

  .notice{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);padding:14px 18px;font-size:14px;color:#cfcfcf}
  .notice svg{flex:none}

  /* Tela 03 */
  .pcard{position:relative;border:1px solid var(--line2);padding:22px;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
  .pcard .reg{position:absolute;color:var(--y);font:300 14px/1 monospace}
  .pfoto{flex:none;width:132px;height:132px;border-radius:50%;border:1px solid var(--y);background:#fff center/72% no-repeat}
  .pfoto.ph{background:repeating-linear-gradient(135deg,#111 0 10px,#161616 10px 20px);display:flex;align-items:center;justify-content:center;font:10px var(--mono);color:var(--dim);text-align:center}
  .pinfo{flex:1 1 260px;display:flex;flex-direction:column;gap:10px;min-width:0}
  .pinfo h1{margin:0;font:600 26px/1.1 var(--fh);text-transform:uppercase;text-wrap:pretty}
  .codes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
  .codes > div{background:#000;padding:9px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
  .codes small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
  .codes span{font:14px var(--mono);overflow-wrap:anywhere}
  .instr{margin:0;padding-left:18px;color:#cfcfcf;font-size:13px}

  .slots{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:start;justify-items:center}
  .slot{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
  .circle{width:190px;height:190px;max-width:40vw;max-height:40vw;border-radius:50%;border:2px solid var(--y);background:var(--s1);color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:0}
  .circle:hover{background:var(--s3)} .circle:active{background:var(--s4)}
  .circle:disabled{cursor:default;border-style:dashed;border-color:#444;opacity:.7}
  .circle b{font:600 18px/1 var(--fh);letter-spacing:.1em;text-transform:uppercase}
  .circle small{font-size:12px;color:var(--muted);text-align:center;padding:0 14px}
  .read{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:40px;text-align:center}
  .read small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .read span{font:14px var(--mono);overflow-wrap:anywhere}
  .compare{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:70px}

  .result{border:1px solid var(--line2);padding:18px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .result .dot{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 22px var(--fh)}
  .result .txt{flex:1 1 220px;display:flex;flex-direction:column;gap:4px}
  .result .t{font:600 22px/1.1 var(--fh);text-transform:uppercase;letter-spacing:.04em}
  .result .d{font-size:14px;color:#cfcfcf}
  .counter{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:16px;flex-wrap:wrap}
  .counter strong{color:#fff;font:600 20px var(--fh)}
  .toggles{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .toggles label{display:flex;gap:8px;align-items:center;cursor:pointer}
  .toggles input{accent-color:var(--y);width:16px;height:16px}

  /* Checklist da embalagem (aparece quando produto e etiqueta batem) */
  .check{border:1px solid var(--ok);padding:20px;display:flex;flex-direction:column;gap:12px}
  .check-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  .check-head a{font-size:13px}
  .check-item{display:flex;align-items:center;gap:18px;width:100%;text-align:left;background:#000;border:1px solid var(--line2);color:#fff;padding:18px 20px;font:600 26px/1.15 var(--fh);text-transform:uppercase;letter-spacing:.03em;cursor:pointer}
  .check-item:hover{border-color:#555}
  .check-item .box{flex:none;width:40px;height:40px;border:2px solid var(--y);display:flex;align-items:center;justify-content:center;font:700 28px/1 var(--fh);color:#000}
  .check-item.on{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
  .check-item.on .box{background:var(--ok);border-color:var(--ok)}
  .btn-done{height:76px;width:100%;font-size:26px;letter-spacing:.12em}
  .btn-done:disabled{background:var(--s4);border-color:var(--line2);color:var(--dim);opacity:1}
  .qtd-row{display:flex;gap:8px;align-items:stretch}
  .qtd-btn{flex:none;width:64px;height:64px;background:#000;border:1px solid var(--line2);color:var(--y);font:600 34px/1 var(--fh);cursor:pointer}
  .qtd-btn:hover{border-color:var(--y)}
  .qtd-input{flex:1;min-width:0;height:64px;text-align:center;font:600 32px var(--fh);-moz-appearance:textfield}
  .qtd-input::-webkit-outer-spin-button,.qtd-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .qtd-tudo{height:64px;font-size:18px}
  .quem-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .quem-grid button{height:68px;background:#000;border:1px solid var(--line2);color:#fff;font:600 24px var(--fh);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
  .quem-grid button:hover{border-color:var(--y);color:var(--y)}
  .quem-grid button.last{border-color:var(--y)}
  .quem-grid button.on{background:var(--y);border-color:var(--y);color:#000}

  /* Modais */
  .modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:16px}
  .mbox{width:100%;max-width:460px;max-height:calc(100vh - 32px);overflow:auto;border:1px solid var(--line2);background:var(--s1);display:flex;flex-direction:column}
  .mbox.wide{max-width:620px}
  .mhead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font:600 16px var(--fh);letter-spacing:.12em;text-transform:uppercase}
  .mhead button{background:transparent;border:0;color:var(--muted);cursor:pointer;font-size:24px;line-height:1}
  .mbody{padding:18px;display:flex;flex-direction:column;gap:12px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field input,.minput{height:44px;background:#000;border:1px solid var(--line2);color:#fff;padding:0 12px;font:15px var(--fb);outline:0;width:100%}
  .minput{font-family:var(--mono)}
  .field input:focus,.minput:focus{border-color:var(--y)}
  .viewer{position:relative;background:repeating-linear-gradient(0deg,#0d0d0d 0 3px,#111 3px 6px);min-height:240px}
  #cam{width:100%}
  #cam video{width:100% !important;display:block}
  .viewer .hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:13px;color:#cfcfcf;pointer-events:none;text-shadow:0 1px 3px #000}
  .viewer .frame{position:absolute;left:12%;right:12%;top:30%;bottom:30%;pointer-events:none}
  .viewer .frame i{position:absolute;width:26px;height:26px;border-color:var(--y);border-style:solid}
  .viewer .scanline{position:absolute;left:6%;right:6%;height:2px;background:var(--y);box-shadow:0 0 12px var(--y);animation:kxScan 2.2s ease-in-out infinite}
  @keyframes kxScan{0%{top:8%}50%{top:88%}100%{top:8%}}
  .warn{border:1px solid #5a4210;color:var(--y);padding:10px 12px;font-size:13px}
  .err{border:1px solid #5c2323;color:var(--badtxt);padding:10px 12px;font-size:13px}
  .choice{display:flex;flex-direction:column;gap:8px}
  .choice button{text-align:left;background:#000;border:1px solid var(--line2);color:#fff;padding:12px;cursor:pointer;font:14px var(--fb)}
  .choice button:hover{border-color:var(--y)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:30;background:var(--s4);border:1px solid var(--line2);padding:12px 18px;font-size:14px;max-width:calc(100vw - 32px)}
  .log{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
  .log b{font-weight:600}

  @media (max-width:820px){
    header{padding:10px 16px}
    main{padding:22px 16px 64px;gap:20px}
    .h1{font-size:34px}
    .thead{display:none}
    .trow{grid-template-columns:1fr 1fr;gap:12px;padding:16px}
    .trow > .full{grid-column:1 / -1}
    .trow .cta{justify-self:start}
    .g-itm > svg{display:none}
    .compare{margin-top:60px}
    .compare svg{width:28px;height:28px}
  }
</style>
</head>

<script>
const API = "/api/full";
const Y = "#F3AA07";
const ICON = {
  search:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9a9a9a" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>',
  chev:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m9 18 6-6-6-6"/></svg>',
  back:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m15 18-6-6 6-6"/></svg>',
  barcode:'<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8v8M10 8v8M13 8v8M17 8v8"/></svg>',
  tag:'<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.7 8.7a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4z"/><path d="M7.5 7.5h.01"/></svg>',
  swap:'<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#F3AA07" stroke-width="1.5"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>',
  info:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F3AA07" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>',
};

// ---------- utilidades ----------
const $ = (id) => document.getElementById(id);
const show = (id) => $(id).classList.remove("hidden");
const hide = (id) => $(id).classList.add("hidden");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmt = (n) => Number(n || 0).toLocaleString("pt-BR");
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
const go = (h) => { if (location.hash === h) route(); else location.hash = h; };
function toast(msg, ms = 2600) { const t = $("toast"); t.textContent = msg; show("toast"); clearTimeout(toast._t); toast._t = setTimeout(() => hide("toast"), ms); }
function pref(k, def) { try { const v = localStorage.getItem("kxfull." + k); return v == null ? def : v === "1"; } catch { return def; } }
function setPref(k, v) { try { localStorage.setItem("kxfull." + k, v ? "1" : "0"); } catch {} }

async function api(body) {
  const r = await fetch(API, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : undefined);
  const d = await r.json().catch(() => ({ ok: false, error: "Resposta inválida do servidor (" + r.status + ")" }));
  if (!d.ok) throw new Error(d.error || "Erro " + r.status);
  return d;
}
async function apiGet(qs) {
  const r = await fetch(API + (qs || ""));
  const d = await r.json().catch(() => ({ ok: false, error: "Resposta inválida do servidor (" + r.status + ")" }));
  if (!d.ok) throw new Error(d.error || "Erro " + r.status);
  return d;
}

// Bipe curto: agudo = bateu, grave = não bateu (dá pra conferir sem olhar a tela).
let actx;
function beep(ok) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = ok ? 1250 : 220; o.type = ok ? "sine" : "square";
    g.gain.value = 0.08; o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + (ok ? 0.12 : 0.35));
  } catch {}
  if (navigator.vibrate) navigator.vibrate(ok ? 60 : [120, 60, 120]);
}

// ---------- regra de conferência ----------
// Etiqueta do Full: o código de barras traz o Código ML (inventory_id: 4 letras + 5 dígitos).
// Produto: aceita o EAN do PDF, os GTINs do anúncio no ML ou o SKU.
const norm = (s) => String(s || "").trim().toUpperCase().replace(/\s+/g, "");
const digits = (s) => s.replace(/^0+/, "");
function labelCode(raw) { const c = norm(raw); const m = c.match(/[A-Z]{4}\d{5}/); return m ? m[0] : c; }
function productCodes(it) {
  return [it.ean, ...(it.gtins || [])].filter(Boolean).map((x) => digits(norm(x)));
}
function productMatches(it, raw) {
  const c = norm(raw);
  if (!c) return false;
  if (/^\d+$/.test(c)) return productCodes(it).includes(digits(c));
  return !!it.sku && norm(it.sku) === c;
}
const precisaEtiqueta = (it) => !/universal/i.test(it.identificacao || "");
const findByLabel = (raw) => S.itens.filter((i) => i.inv === labelCode(raw));
const findByProduct = (raw) => S.itens.filter((i) => productMatches(i, raw));

// ---------- estado ----------
const S = {
  envios: [], filtro: "prep", busca: "",
  envio: null, itens: [], leituras: [], itemFiltro: "todos",
  inv: null, prod: null, etq: null, manualProd: false, slot: null,
};

// ---------- roteamento ----------
window.addEventListener("hashchange", route);
async function route() {
  closeScanner();
  if (location.hash.startsWith("#/ml=")) {
    const raw = decodeURIComponent(location.hash.slice(5));
    history.replaceState(null, "", location.pathname + "#/"); // não reimporta ao recarregar
    try { await loadEnvios(); } catch {}
    renderLista();
    return handleMlPayload(raw);
  }
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean).map(decodeURIComponent);
  try {
    if (parts[0] === "envio" && parts[1]) {
      if (!S.envio || S.envio.frete !== parts[1] || !parts[2]) await loadEnvio(parts[1]);
      if (parts[2]) return renderProduto(parts[2]);
      return renderEnvio();
    }
    await loadEnvios();
    renderLista();
  } catch (e) {
    $("view").innerHTML = `<main><div class="err">${esc(e.message)}</div><a href="#/">← Voltar aos envios</a></main>`;
  }
}
function crumb(list) {
  $("crumb").innerHTML = list.map((c, k) => (k ? '<span class="sep">/</span>' : "") +
    (c.href ? `<a href="${c.href}">${esc(c.t)}</a>` : `<span class="cur">${esc(c.t)}</span>`)).join("");
}

// ---------- Tela 01: envios ----------
async function loadEnvios() { S.envios = (await apiGet()).envios; }

function renderLista() {
  crumb([{ t: "Envios" }]);
  const prep = S.envios.filter((e) => e.status !== "despachado");
  const list = S.envios.filter((e) =>
    (S.filtro === "todos" || (S.filtro === "prep" ? e.status !== "despachado" : e.status === "despachado")) &&
    e.frete.includes(S.busca.replace("#", "").trim()));
  $("view").innerHTML = `
  <main>
    <div class="head">
      <div>
        <span class="eyebrow">Tela 01</span>
        <h1 class="h1">Envios Full</h1>
        <p class="sub">Escolha um envio para montar e conferir as unidades.</p>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn ghost" onclick="openMlHelp()">Botão do ML (teste)</button>
        <button class="btn" onclick="openImport()">Importar PDF do frete</button>
      </div>
    </div>
    <div class="kpis">
      <div><b>${prep.length}</b><span>Envios em preparação</span></div>
      <div><b style="color:${Y}">${fmt(prep.reduce((a, e) => a + e.declaradas - e.conferidas, 0))}</b><span>Unidades a conferir</span></div>
      <div><b style="color:var(--badtxt)">${S.envios.filter((e) => e.divergencias && e.status !== "despachado").length}</b><span>Com leitura divergente</span></div>
    </div>
    <div class="tools">
      <div class="search">${ICON.search}<input id="busca" value="${esc(S.busca)}" placeholder="Buscar por n.º do frete" oninput="S.busca=this.value;renderListaRows()"></div>
      <div class="seg">${[["todos","Todos"],["prep","Em preparação"],["desp","Despachados"]].map(([k,l]) =>
        `<button class="${S.filtro===k?"on":""}" onclick="S.filtro='${k}';renderLista()">${l}</button>`).join("")}</div>
    </div>
    <div class="table">
      <div class="thead g-env lbl"><span>Envio</span><span>Declaradas / Conferidas</span><span>Coleta</span><span>Conferência</span><span>Status</span><span></span></div>
      <div id="rows"></div>
    </div>
  </main>`;
  renderListaRows(list);
}
function renderListaRows(list) {
  list = list || S.envios.filter((e) =>
    (S.filtro === "todos" || (S.filtro === "prep" ? e.status !== "despachado" : e.status === "despachado")) &&
    e.frete.includes(S.busca.replace("#", "").trim()));
  $("rows").innerHTML = list.length ? list.map((e) => {
    const p = pct(e.conferidas, e.declaradas), desp = e.status === "despachado", done = p === 100;
    const st = desp ? ["Despachado", "var(--muted)"] : done ? ["Conferido", "var(--ok)"] : ["Em preparação", Y];
    return `<div class="trow g-env" onclick="go('#/envio/${encodeURIComponent(e.frete)}')">
      <div class="full" style="display:flex;flex-direction:column;gap:6px;align-items:flex-start">
        <span style="font:600 24px/1 var(--fh)">#${esc(e.frete)}</span>
        <span style="font-size:13px;color:var(--muted)">${e.produtos} produtos · importado ${new Date(e.importado_em).toLocaleDateString("pt-BR")}</span>
        ${e.divergencias && !desp ? '<span class="flag">Leitura divergente</span>' : ""}
        ${e.alertas && !desp ? `<span class="flag flag-y">${e.alertas} produto(s) em alerta</span>` : ""}
      </div>
      <span style="font:500 20px var(--fh)">${fmt(e.declaradas)} <span style="color:var(--dim)">/ ${fmt(e.conferidas)}</span></span>
      <div style="display:flex;flex-direction:column;gap:3px"><span>${esc(e.data_coleta || "—")}</span><span style="font-size:12px;color:var(--muted)">${esc(e.centro || "Centro não informado")}</span></div>
      <div class="full" style="display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:var(--muted)">${fmt(e.conferidas)} de ${fmt(e.declaradas)} un.</span><span style="color:${done?"var(--ok)":Y};font-weight:600">${p}%</span></div>
        <div class="bar"><i style="width:${p}%;background:${done?"var(--ok)":Y}"></i></div>
      </div>
      <span class="st" style="color:${st[1]}">${st[0]}</span>

function closeImport() { hide("impModal"); IMP = null; }

function parseCsv(text) {
  const rows = text.replace(/^﻿/, "").split(/\r?\n/).filter((l) => l.trim());
  const sep = rows[0].includes(";") ? ";" : ",";
  const split = (l) => { const out = []; let cur = "", q = false; for (const ch of l) { if (ch === '"') q = !q; else if (ch === sep && !q) { out.push(cur); cur = ""; } else cur += ch; } out.push(cur); return out.map((s) => s.trim()); };
  const head = split(rows[0]).map((h) => h.toLowerCase());
  const col = (...names) => head.findIndex((h) => names.some((n) => h.includes(n)));
  const ci = col("etiqueta", "código ml", "codigo ml"), cs = col("sku"), cp = col("produto", "título", "titulo"), cq = col("quantidade", "unidades"), ce = col("ean", "universal");
  if (ci < 0 || cq < 0) throw new Error("CSV sem as colunas Etiqueta/Código ML e Quantidade.");
  const itens = rows.slice(1).map(split).map((r) => ({
    inv: (r[ci] || "").toUpperCase(), sku: cs >= 0 ? r[cs] : null, titulo: cp >= 0 ? r[cp] : null,
    ean: ce >= 0 && /^\d{8,14}$/.test(r[ce] || "") ? r[ce] : null,
    unidades: parseInt(r[cq], 10) || 0, identificacao: "Etiquetagem obrigatória", tags: [], instrucoes: [],
  })).filter((i) => /^[A-Z]{4}\d{5}$/.test(i.inv) && i.unidades > 0);
  return { frete: null, itens, avisos: [], totalProdutos: null, totalUnidades: null };
}

async function readImport(file) {
  const prev = $("impPrev");
  if (!file) return;
  prev.innerHTML = '<p style="color:var(--muted)">Lendo arquivo…</p>';
  try {
    let r;
    if (/\.csv$/i.test(file.name) || file.type === "text/csv") {
      r = parseCsv(await file.text());
      r.origem = "csv";
      const d = (file.name.match(/\d{4}-\d{2}-\d{2}/) || [new Date().toISOString().slice(0, 10)])[0];
      r.frete = IMP.reFrete || "PLANO-" + d;
    } else {
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      r = await KxFullPDF.readFile(file);
      r.origem = "pdf";
    }
    if (!r.itens.length) throw new Error("Não achei nenhuma linha de produto nesse arquivo.");
    if (IMP.reFrete && r.frete && r.frete !== IMP.reFrete && r.origem === "pdf")
      r.avisos.unshift(`Esse PDF é do frete #${r.frete}, não do #${IMP.reFrete}. Ele vai entrar como um envio separado.`);
    renderImpPreview(r);
  } catch (e) {
    prev.innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

      <div class="codes" style="grid-template-columns:repeat(3,minmax(0,1fr))">

function bookmarkletHref() {
  const target = location.origin + location.pathname;
  const code = `(function(){var d={u:location.href,t:document.body.innerText.slice(0,180000)};` +
    `window.open(${JSON.stringify(target)}+'#/ml='+encodeURIComponent(JSON.stringify(d)),'kxscanner');})();`;
  return "javascript:" + encodeURIComponent(code); // "#" sem escape cortaria o favorito
}

function filtrosEnvio() {
  const base = [
    ["todos", "Todos", () => true],
    ["pend", "Pendentes", (i) => i.conferidas < i.unidades],
    ["prontos", "Prontos", (i) => i.conferidas >= i.unidades],
    ["separados", "Separados", (i) => i.separado],
    ["alerta", "⚠ Com alerta", (i) => i.alerta],
  ];
  const nomes = [...new Set(Object.values(S.feitosPor || {}).flat())].sort((a, b) => a.localeCompare(b, "pt-BR"));
  const pessoas = nomes.map((n) => ["por:" + n, n, (i) => (S.feitosPor[i.inv] || []).includes(n)]);
  return { base, pessoas, todos: [...base, ...pessoas] };
}

// em cada pacote, alertas e caixas para marcar à mão. Abre numa janela e chama a impressão
// (no diálogo, "Salvar como PDF" gera o arquivo).
function imprimirEnvio() {
  const e = S.envio, fl = filtrosEnvio();
  const atual = fl.todos.find(([k]) => k === S.itemFiltro) || fl.base[0];
  const lista = S.itens.filter(atual[2]);
  if (!lista.length) return toast("Nenhum produto neste filtro para imprimir.");
  const unid = lista.reduce((a, i) => a + i.unidades, 0);
  const agora = new Date().toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
  const linhas = lista.map((it, n) => {

function evaluate(it) {
  const modo = modoDe(it);
  const needEtq = modo !== "universal";
  const needProd = modo === "normal";               // kit: não tem um código só de produto
  const pOk = !needProd || (S.prod && productMatches(it, S.prod));
  const eOk = !needEtq || (S.etq && labelCode(S.etq) === it.inv);
  const prodWrong = needProd && !!S.prod && !productMatches(it, S.prod);
  const etqWrong = needEtq && !!S.etq && labelCode(S.etq) !== it.inv;
  const base = { prodWrong, etqWrong };
  if (it.conferidas >= it.unidades)
    return { ...base, state: "full", border: "var(--ok)", bg: "var(--okbg)", dot: "var(--ok)", dotFg: "#000", glyph: "✓", titleColor: "var(--ok)", title: "Produto completo", text: `As ${fmt(it.unidades)} unidades declaradas já foram conferidas. Não coloque mais nenhuma na caixa.` };
  if (prodWrong || etqWrong) {
    const quem = [];
    if (prodWrong) { const o = findByProduct(S.prod).filter((x) => x.inv !== it.inv); quem.push(o.length ? `O código do produto é de <b>${esc(o[0].titulo)}</b> (${esc(o[0].inv)}).` : "O código do produto não pertence a nenhum item deste envio."); }
    if (etqWrong) { const o = findByLabel(S.etq).filter((x) => x.inv !== it.inv); quem.push(o.length ? `A etiqueta é de <b>${esc(o[0].titulo)}</b> (${esc(o[0].inv)}).` : `A etiqueta (${esc(labelCode(S.etq))}) não pertence a este envio.`); }
    return { ...base, state: "bad", border: "var(--bad)", bg: "var(--badbg)", dot: "var(--bad)", dotFg: "#000", glyph: "!", titleColor: "var(--badtxt)", title: "Não confere", text: quem.join(" ") + " Separe a unidade e confira." };
  }
  const leu = (needProd && S.prod) || (needEtq && S.etq);
  if (leu && pOk && eOk)
    return { ...base, state: "ok", border: "var(--ok)", bg: "var(--okbg)", dot: "var(--ok)", dotFg: "#000", glyph: "✓", titleColor: "var(--ok)", title: modo === "kit" ? "Etiqueta confere" : "Mesmo produto", text: (modo === "kit" ? "Etiqueta do kit certa." : "Produto e etiqueta batem.") + " Siga o checklist abaixo." };
  if (leu)
    return { ...base, state: "half", border: Y, bg: "transparent", dot: Y, dotFg: "#000", glyph: "1", titleColor: Y, title: "Falta uma leitura", text: S.etq ? "Etiqueta lida. Leia o código do produto (ou siga o checklist)." : "Produto lido. Cole a etiqueta do ML e leia a etiqueta (ou siga o checklist)." };
  return { ...base, state: "idle", border: "var(--line2)", bg: "transparent", dot: "var(--s4)", dotFg: "var(--muted)", glyph: "?", titleColor: "#fff", title: modo === "kit" ? "Kit: confira item por item" : "Leitura opcional",
    text: modo === "kit" ? "Este anúncio tem mais de um item: marque cada um no checklist. Ler a etiqueta do kit é opcional." : "Leia o produto e a etiqueta para conferir, ou siga direto o checklist." };
}

let busy = false;
async function onRead(slot, code) {
  const it = curItem(); if (!it) return;
  if (slot === "prod") S.prod = norm(code); else S.etq = norm(code);
  const R = evaluate(it);
  if (R.state === "bad") {
    beep(false);
    api({ acao: "leitura", frete: S.envio.frete, inv: it.inv, codigo_produto: S.prod, codigo_etiqueta: S.etq, resultado: "divergente",
      detalhe: (R.prodWrong ? "produto " + S.prod : "") + (R.prodWrong && R.etqWrong ? " · " : "") + (R.etqWrong ? "etiqueta " + labelCode(S.etq) : "") }).catch(() => {});
    renderProduto(it.inv); return;
  }
  if (R.state === "ok") {
    beep(true);
    renderProduto(it.inv);
    document.querySelector(".check")?.scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
  beep(true);
  renderProduto(it.inv);
  // Falta a outra leitura: abre o scanner direto nela.
  const modo = modoDe(it);
  const next = modo === "normal" && !S.prod ? "prod" : modo !== "universal" && !S.etq ? "etq" : null;
  if (next) openScanner(next);
}

// ---------- Checklist da embalagem + quem etiquetou ----------
// O checklist e o botão "Marcar como feito" ficam sempre na tela: a leitura dos códigos é
// opcional (kit não tem um código só). A unidade conta depois do checklist completo, do botão
// e de escolher quem etiquetou. Só uma leitura ERRADA (vermelho) trava o botão.
//
// O checklist é por ETIQUETA (Código ML), não por SKU: anúncios com o mesmo SKU podem levar
// coisas diferentes (pistola com e sem bicos, cera com e sem flanela). Só tem checklist o
// anúncio que é kit ou que leva algo além do produto ("+ flanela" etc.). Sem cadastro, a tela
// NUNCA presume "só o produto": diz que não tem informação e pede para conferir o anúncio
// (o Triple Wax 100g aparecia como sem flanela e leva flanela de brinde). Checklist salvo com
// a lista vazia = vocês confirmaram que vai só o produto. (Bernardo, 12/10/2026)
const EQUIPE = ["Douglas", "Ber", "Wilson", "Cássia", "Giulia"];
const CONFERIR_ANUNCIO = "Conferi no anúncio o que vai neste pacote";
const ckEtq = (it) => (S.checklistsEtq || {})[it.inv] || null;
const passosDe = (it) => { const ck = ckEtq(it); return ck ? ck.passos || [] : [CONFERIR_ANUNCIO]; };
function modoDe(it) {
  if (/universal/i.test(it.identificacao || "")) return "universal";
  if (ckEtq(it)?.kit) return "kit";
  return "normal";
}

function checklistHtml(it, R) {
  const passos = passosDe(it), feitos = S.feitos || new Set();
  const todos = passos.every((_, k) => feitos.has(k));
  const ck = ckEtq(it);
  const travado = R && R.state === "bad";
  const titulo = !ck ? "Sem checklist cadastrado" : !passos.length ? "Produto simples" : ck.kit ? "O que vai neste anúncio" : "Checklist da embalagem";
  return `
    <section class="check" ${ck ? "" : 'style="border-color:var(--y)"'}>
      <div class="check-head">
        <span class="eyebrow">${titulo}</span>
      </div>
      ${!ck ? `<p style="margin:0;font-size:18px;line-height:1.4"><b style="color:var(--y)">Não tenho informação sobre o checklist deste anúncio.</b> Abra o anúncio e confira o que vai junto antes de embalar. Depois, cadastre em "alterar checklist" no fim da página.</p>
        ${it.permalink ? `<a href="${esc(it.permalink)}" target="_blank" rel="noopener" style="font-size:15px">Ver anúncio ${esc(it.item_id || "")} ↗</a>` : ""}` : ""}
      ${ck && !ck.revisado && passos.length ? `<span style="font-size:12px;color:var(--y)">Montado a partir da descrição do anúncio. Confira na primeira vez e salve em "alterar checklist" para marcar como revisado.</span>` : ""}
      ${passos.length ? passos.map((p, k) => `
        <button class="check-item ${feitos.has(k) ? "on" : ""}" onclick="togglePasso(${k})">
          <span class="box">${feitos.has(k) ? "✓" : ""}</span><span>${esc(p)}</span>
        </button>`).join("") : `<p style="margin:0;font-size:18px;line-height:1.4">Vai <b>só o produto</b> deste anúncio (cadastrado por vocês). <b style="color:var(--y)">Não colocar</b> flanela, aplicador nem outro item.</p>`}
      <button class="btn btn-done" ${todos && !travado ? "" : "disabled"} onclick="openQuem()">Marcar como feito</button>
      ${travado ? `<span style="font-size:13px;color:var(--badtxt);text-align:center">Leitura errada: separe a unidade e toque em "Ler de novo".</span>`
        : todos ? "" : `<span style="font-size:13px;color:var(--muted);text-align:center">Marque ${passos.length - feitos.size} item(ns) para liberar.</span>`}
    </section>`;
}
function togglePasso(k) {
  S.feitos = S.feitos || new Set();
  S.feitos.has(k) ? S.feitos.delete(k) : S.feitos.add(k);
  const y = window.scrollY; renderProduto(S.inv); window.scrollTo(0, y);
}
// Quantidade da janela "Quem etiquetou?": de 1 até o que falta do produto ("Tudo").
function setQtd(v, digitando) {
  const n = parseInt(v, 10);
  S.qtd = Math.max(1, Math.min(S.qtdMax, isNaN(n) ? 1 : n));
  if (!digitando || String(S.qtd) !== String(v)) $("qtdInput").value = S.qtd;
  $("qtdInfo").textContent = `Falta(m) ${fmt(S.qtdMax)} un. deste produto · vai somar ${fmt(S.qtd)}.`;
}
function openQuem() {
  const it = curItem(); if (!it) return;
  S.qtdMax = Math.max(1, it.unidades - it.conferidas);
  setQtd(1);
  $("qtdTudo").textContent = `Tudo (${fmt(S.qtdMax)})`;
  // Ninguém vem marcado: cada unidade exige escolher. A(s) última(s) pessoa(s) só ganham
  // borda amarela, e os nomes digitados em "Outro" ficam como botões nas próximas vezes.
  S.quemSel = new Set();
  let ultimos = [], outros = [];
  try { ultimos = JSON.parse(localStorage.getItem("kxfull.quem.ultimos") || "[]"); outros = JSON.parse(localStorage.getItem("kxfull.outros") || "[]"); } catch {}
  S.quemLista = [...EQUIPE, ...outros.filter((n) => !EQUIPE.includes(n))];
  S.quemUltimos = ultimos;
  $("quemOutro").value = "";
  renderQuem();
  show("quemModal");
}
function renderQuem() {
  $("quemGrid").innerHTML = S.quemLista.map((n, k) =>
    `<button class="${S.quemSel.has(n) ? "on" : S.quemUltimos.includes(n) ? "last" : ""}" onclick="toggleQuem(${k})">${S.quemSel.has(n) ? "✓ " : ""}${esc(n)}</button>`).join("");
  const nomes = [...S.quemSel];
  $("quemGo").disabled = !nomes.length;
  $("quemGo").textContent = nomes.length ? `Confirmar · ${nomes.join(", ")}` : "Escolha quem etiquetou";
}
function toggleQuem(k) {
  const n = S.quemLista[k];
  S.quemSel.has(n) ? S.quemSel.delete(n) : S.quemSel.add(n);
  renderQuem();
}
function addOutro() {
  const n = $("quemOutro").value.trim().replace(/\s+/g, " ");
  if (!n) return toast("Digite o nome em \"Outro\".");
  if (!S.quemLista.includes(n)) S.quemLista.push(n);
  S.quemSel.add(n); $("quemOutro").value = "";
  renderQuem();
}
function confirmarQuem() {
  const nomes = [...S.quemSel];
  if (!nomes.length) return toast("Escolha quem etiquetou.");
  try {
    localStorage.setItem("kxfull.quem.ultimos", JSON.stringify(nomes));
    const outros = S.quemLista.filter((n) => !EQUIPE.includes(n) && nomes.includes(n));
    const antigos = JSON.parse(localStorage.getItem("kxfull.outros") || "[]");
    localStorage.setItem("kxfull.outros", JSON.stringify([...new Set([...outros, ...antigos])].slice(0, 6)));
  } catch {}
  hide("quemModal");
  confirmUnit(nomes.join(", "));
}
function editChecklist() {
  const it = curItem(); if (!it) return;
  const ck = ckEtq(it);
  IMP = {};
  $("impBody").innerHTML = `
    <p style="margin:0;font-size:14px;color:#cfcfcf">Itens e passos da etiqueta <b class="mono">${esc(it.inv)}</b>, um por linha. Vale <b>só para este anúncio</b> (outros anúncios com o mesmo SKU têm o checklist deles). Deixe vazio se não precisa de nada.</p>
    <textarea id="ckText" class="minput" style="height:220px;padding:10px;font-family:var(--fb);font-size:16px;line-height:1.5" placeholder="Ex.: 1x Cera Triple Wax 100 g&#10;1x Aplicador de espuma&#10;1x Flanela cinza 30x30">${esc((ck?.passos || []).join("\n"))}</textarea>
    <p style="margin:0;font-size:12px;color:var(--muted)">Salvar com a lista vazia = confirmar que vai <b>só o produto</b>. Fica gravado para os próximos envios deste anúncio.</p>
    <label style="display:flex;gap:10px;align-items:center;font-size:14px;color:#cfcfcf"><input type="checkbox" id="ckKit" ${ck?.kit ? "checked" : ""} style="width:18px;height:18px;accent-color:var(--y)"> Anúncio com mais de um item (kit): sem leitura do código do produto</label>
    <button class="btn" id="ckGo" onclick="saveChecklist()">Salvar e marcar como revisado</button>`;
  show("impModal");
}
async function saveChecklist() {
  const it = curItem(), btn = $("ckGo");
  btn.disabled = true; btn.textContent = "Salvando…";
  try {
    const r = await api({ acao: "checklist", inv: it.inv, sku: it.sku, titulo: it.titulo, item_id: it.item_id,
      kit: $("ckKit").checked, passos: $("ckText").value.split("\n") });
    S.checklistsEtq = { ...(S.checklistsEtq || {}), [it.inv]: r.checklist };
    S.feitos = new Set(); closeImport(); renderProduto(it.inv); toast("Checklist salvo para esta etiqueta.");
  } catch (e) { btn.disabled = false; btn.textContent = "Tentar de novo"; toast(e.message, 5000); }
}

async function confirmUnit(responsavel) {
  const it = curItem(); if (!it || busy) return;
  const R = evaluate(it);
  if (R.state === "bad") return toast("Leitura errada: toque em \"Ler de novo\" antes.");
  busy = true;
  const btn = document.querySelector(".btn-done"); if (btn) { btn.disabled = true; btn.textContent = "Salvando…"; }
  const passos = passosDe(it).filter((_, k) => (S.feitos || new Set()).has(k));
  try {
    const qtd = Math.max(1, Math.min(S.qtd || 1, it.unidades - it.conferidas));
    const r = await api({ acao: "conferir", frete: S.envio.frete, inv: it.inv, delta: qtd, codigo_produto: S.prod,
      codigo_etiqueta: S.etq, resultado: R.state === "ok" ? "ok" : "sem_leitura", responsavel, passos });
    it.conferidas = r.conferidas;
    S.prod = null; S.etq = null; S.feitos = new Set();
    window.scrollTo(0, 0);
    renderProduto(it.inv);
    toast(`${fmt(qtd)} un. feita(s) por ${responsavel} · ${fmt(it.conferidas)} de ${fmt(it.unidades)}`, 2200);
    const modo = modoDe(it);
    if (it.conferidas < it.unidades && pref("reopen", true) && modo !== "universal") openScanner(modo === "kit" ? "etq" : "prod");
    else if (it.conferidas >= it.unidades) beep(true);
  } catch (e) { toast("Não somou: " + e.message, 5000); renderProduto(it.inv); }
  busy = false;
}
async function undoUnit() {
  const it = curItem(); if (!it || !confirm("Tirar 1 unidade da contagem deste produto?")) return;
  try {
    const r = await api({ acao: "conferir", frete: S.envio.frete, inv: it.inv, delta: -1, resultado: "desfeito" });
    it.conferidas = r.conferidas; renderProduto(it.inv);
  } catch (e) { toast(e.message, 5000); }
}
function resetReads() { S.prod = null; S.etq = null; renderProduto(S.inv); }

// "Achar o produto" na Tela 02: aceita etiqueta ou código do produto e já deixa a leitura preenchida.
function onFind(code) {
  const F = encodeURIComponent(S.envio.frete);
  const byL = findByLabel(code), byP = findByProduct(code);
  const open = (it, slot) => {
    S.inv = it.inv; S.prod = slot === "prod" ? norm(code) : null; S.etq = slot === "etq" ? norm(code) : null; S.feitos = new Set();
    const m = modoDe(it); // já abre a leitura que falta
    S.openNext = slot === "etq" ? (m === "normal" ? "prod" : null) : m !== "universal" ? "etq" : null;
    beep(true); location.hash = `#/envio/${F}/${it.inv}`;
  };
  if (byL.length) return open(byL[0], "etq");
  if (byP.length === 1) return open(byP[0], "prod");
  if (byP.length > 1) {
    beep(true);
    $("choiceTitle").textContent = "Mesmo EAN em " + byP.length + " etiquetas";
    $("choiceList").innerHTML = `<p style="margin:0;font-size:13px;color:#cfcfcf">Esse código está em mais de uma linha do envio. Confira a etiqueta para saber qual é:</p>` +
      byP.map((it) => `<button data-inv="${esc(it.inv)}"><b class="mono">${esc(it.inv)}</b> · ${esc(it.titulo)}<br><span style="color:var(--muted);font-size:12px">${esc(it.identificacao || "")} · ${fmt(it.conferidas)}/${fmt(it.unidades)} un.</span></button>`).join("");
    $("choiceList").querySelectorAll("button").forEach((b) => (b.onclick = () => { hide("choiceModal"); open(S.itens.find((i) => i.inv === b.dataset.inv), "prod"); }));
    show("choiceModal"); return;
  }
  beep(false);
  toast("Esse código não pertence a nenhum produto do envio #" + S.envio.frete, 4000);
}

// ---------- Scanner (câmera + teclado) ----------
let cam = null, camOn = false, lastCode = "", lastAt = 0;
const SCAN_TXT = {
  prod: ["Ler código do produto", "Aponte para o código de barras da embalagem (EAN)"],
  etq: ["Ler etiqueta Full", "Aponte para o código de barras da etiqueta do Mercado Livre"],
  achar: ["Achar produto", "Leia a etiqueta ou o código de qualquer produto do envio"],
};
async function openScanner(slot) {
  S.slot = slot;
  $("scanTitle").textContent = SCAN_TXT[slot][0];
  $("scanHint").textContent = SCAN_TXT[slot][1];
  $("manual").value = ""; hide("camErr");
  show("scanModal");
  setTimeout(() => $("manual").focus({ preventScroll: true }), 50);
  if (camOn) return;
  try {
    const F = Html5QrcodeSupportedFormats;
    cam = cam || new Html5Qrcode("cam", {
      verbose: false,
      formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.ITF, F.QR_CODE, F.DATA_MATRIX],
      experimentalFeatures: { useBarCodeDetectorIfSupported: true },
    });
    camOn = true;
    await cam.start({ facingMode: "environment" },
      { fps: 12, qrbox: (w, h) => ({ width: Math.floor(w * 0.82), height: Math.floor(Math.min(h * 0.5, 170)) }) },
      onCamCode, () => {});
    hide("camFrame");
  } catch (e) {
    camOn = false;
    show("camFrame");
    $("camErr").textContent = "Câmera indisponível (" + (e.message || e) + "). Digite o código ou use o leitor USB.";
    show("camErr");
  }
}
async function closeScanner() {
  hide("scanModal");
  if (cam && camOn) { try { await cam.stop(); } catch {} camOn = false; }
}
function onCamCode(text) {
  const now = Date.now();
  if (text === lastCode && now - lastAt < 2500) return;
  lastCode = text; lastAt = now;
  deliver(text);
}
function submitManual() { const v = $("manual").value.trim(); if (v) deliver(v); }
async function deliver(code) {
  const slot = S.slot;
  await closeScanner();
  if (slot === "achar") onFind(code); else onRead(slot, code);
}

// Leitor USB/Bluetooth fora do modal: ele "digita" rápido e termina com Enter.
// Na Tela 03 vai para a leitura que falta; na Tela 02 acha o produto.
let kb = "", kbAt = 0;
document.addEventListener("keydown", (ev) => {
  if (!$("scanModal").classList.contains("hidden") || !$("quemModal").classList.contains("hidden")) return;
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || "")) return;
  const now = Date.now();
  if (now - kbAt > 80) kb = "";
  kbAt = now;
  if (ev.key === "Enter") {
    const code = kb; kb = "";
    if (code.length < 4) return;
    const parts = location.hash.split("/");
    if (parts[3]) {
      const it = curItem();
      const isLabel = /[A-Z]{4}\d{5}/.test(norm(code));
      if (modoDe(it) !== "universal") onRead(isLabel ? "etq" : "prod", code);
    } else if (parts[2]) onFind(code);
    return;
  }
  if (ev.key.length === 1) kb += ev.key;
});

route();
</script>
