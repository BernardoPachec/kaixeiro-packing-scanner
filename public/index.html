<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#000000" />
<title>Kaixeiro · Bancada de Envios</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="Kaixeiro Envios" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  /* Paleta oficial Kaixeiro Digital: apenas preto, branco e amarelo (#F3AA07).
     --danger é a única exceção deliberada, fora da paleta: alerta de quantidade
     precisa ser vermelho pra segurança, ver conversa com o Bernardo. */
  :root{
    --bg:#000000; --card:#0d0d0d; --card2:#1a1a1a; --line:rgba(255,255,255,.14);
    --txt:#ffffff; --muted:rgba(255,255,255,.55); --accent:#F3AA07;
    --danger:#dc2626;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background-color:var(--bg);color:var(--txt);font-weight:400;
    background-image:
      linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
    background-size:32px 32px;
    min-height:100vh;
  }
  header{position:sticky;top:0;z-index:10;background:#000000ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 16px}
  .brand-logo{height:46px;width:auto;display:block}
  main{padding:16px;padding-bottom:110px;max-width:640px;margin:0 auto}
  .hidden{display:none}

  /* Barra de abas flutuante estilo iOS: fixa embaixo, translúcida com blur, só ícones */
  .tabbar{
    position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));
    transform:translateX(-50%);z-index:20;display:flex;gap:4px;
    background:rgba(24,24,24,.6);backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border:1px solid rgba(255,255,255,.14);padding:7px;border-radius:26px;
    box-shadow:0 8px 28px rgba(0,0,0,.45);
  }
  .tabbar button{
    border:none;background:transparent;color:var(--muted);
    font-size:22px;line-height:1;width:50px;height:50px;border-radius:19px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:background .2s ease,color .2s ease,transform .15s ease;
  }
  .tabbar button:active{transform:scale(.92)}
  .tabbar button.active{background:var(--accent);color:#000;box-shadow:0 2px 8px rgba(0,0,0,.35)}

  /* Botões estilo iOS: cantos bem arredondados, feedback de toque via escala */
  .btn{
    display:block;width:100%;padding:15px;border-radius:16px;border:none;
    font-family:inherit;font-weight:600;font-size:16px;cursor:pointer;
    transition:transform .15s cubic-bezier(.4,0,.2,1), opacity .15s ease;
  }
  .btn:active{transform:scale(.97);opacity:.8}
  .btn-primary{background:var(--accent);color:#000}
  .btn-ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
  .btn:disabled{opacity:.5;cursor:default}

  /* Scanner */
  #reader{width:100%;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
  .scan-hint{color:var(--muted);text-align:center;font-size:14px;margin:12px 0}
  .result{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;animation:pop .18s ease}
  @keyframes pop{from{transform:scale(.97);opacity:.3}to{transform:scale(1);opacity:1}}
  .badge{display:inline-block;padding:6px 14px;border-radius:999px;font-weight:800;font-size:15px}
  .badge.Flex{background:var(--accent);color:#000}
  .badge.Agência{background:#fff;color:#000}
  .badge.Full{background:#000;color:#fff;border:1px solid rgba(255,255,255,.4)}
  .prod{font-size:22px;font-weight:700;line-height:1.25;margin:14px 0 4px}
  .qtd{display:inline-block;background:var(--accent);color:#000;font-weight:800;border-radius:10px;padding:4px 12px;font-size:16px}
  .row{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
  .row .k{color:var(--muted)}
  .err{background:#3a1420;border:1px solid #7f2436;color:#ffd5dd}

  .card-row{display:flex;gap:12px;align-items:center}
  .card-foto{width:52px;height:52px;border-radius:12px;object-fit:contain;background:#fff;flex-shrink:0;border:1px solid var(--line)}
  .card-foto-empty{background:var(--card2)}
  .card-info{flex:1;min-width:0}
  .card-info .p{font-weight:600;font-size:15px;margin:0 0 4px}
  .card-info .meta{color:var(--muted);font-size:13px}
  .empty{color:var(--muted);font-size:13px;font-style:italic;padding:6px 2px}
  .refresh{color:var(--accent);background:none;border:none;font-weight:700;cursor:pointer;font-size:14px}

  /* Perguntas */
  .qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;transition:opacity .3s ease}
  .qcard .card-row{align-items:flex-start;margin-bottom:10px}
  .qcard .p{font-weight:600;font-size:14px;margin:0 0 2px;color:var(--muted)}
  .qcard .texto{font-size:16px;font-weight:600;line-height:1.4;margin:0 0 10px}
  .qcard .data{color:var(--muted);font-size:12px;margin-bottom:10px}
  .qcard a.abrir{display:inline-block;color:#000;background:var(--accent);font-weight:700;font-size:13px;padding:8px 14px;border-radius:10px;text-decoration:none}
  .qcard textarea.rascunho{
    width:100%;min-height:84px;background:var(--card2);border:1px solid var(--line);
    border-radius:12px;color:var(--txt);font-family:inherit;font-size:14px;line-height:1.4;
    padding:10px;resize:vertical;display:block;
  }
  .qcard textarea.rascunho::placeholder{color:var(--muted);font-style:italic}
  .qcard .acoes{display:flex;gap:8px;margin-top:10px}
  .qcard .btn-enviar{flex:1;padding:12px;font-size:14px;border-radius:12px}
  .qcard .btn-regenerar{
    background:none;border:1px solid var(--line);color:var(--muted);border-radius:12px;
    padding:0 14px;font-size:16px;cursor:pointer;font-family:inherit;
  }
  .qcard.enviada{opacity:.5}
  .aviso-removido{
    background:rgba(220,38,38,.12);border:1px solid rgba(220,38,38,.4);color:#ff9d9d;
    border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.4;margin-bottom:10px;
  }
  .qcard.qcard-respondida{opacity:.85}
  .qcard.qcard-respondida .resposta-enviada{
    background:var(--card2);border-radius:12px;padding:10px;font-size:14px;line-height:1.4;
    border-left:3px solid var(--accent);margin-top:6px;
  }
  .secao-titulo{color:var(--muted);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin:22px 0 10px;padding-top:14px;border-top:1px solid var(--line)}

  /* Página de resultado */
  #tab-result{padding:16px;max-width:640px;margin:0 auto}
  .fotos-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:4px 0 16px}
  .foto-produto{width:140px;height:140px;border-radius:50%;object-fit:contain;object-position:center;background:#fff;display:block;border:3px solid var(--line);padding:6px}
  .qty-alert{background:var(--danger);color:#fff;font-weight:900;font-size:17px;text-align:center;padding:16px;border-radius:14px;letter-spacing:.3px;margin-bottom:14px;animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.55)}50%{box-shadow:0 0 0 12px rgba(220,38,38,0)}}
  .btn-rescan{margin-top:18px;font-size:17px;padding:16px}
</style>
</head>

<main>
  <!-- SCANNER -->
  <section id="tab-scan">
    <div id="reader"></div>
    <p class="scan-hint" id="scanHint">Aponte a câmera para o QR da etiqueta.</p>
    <button class="btn btn-ghost" id="startBtn" onclick="startScanner()">Ativar câmera</button>
    <div id="result"></div>
  </section>

  <!-- PERGUNTAS -->
  <section id="tab-questions" class="hidden">
    <div style="display:flex;justify-content:space-between;align-items:center;margin:14px 0 12px">
      <span style="color:var(--muted);font-size:14px" id="questionsCount">—</span>
      <button class="refresh" onclick="loadQuestions()">↻ Atualizar</button>
    </div>
    <div id="questionsList"></div>

    <div class="secao-titulo" id="answeredCount">Respondidas</div>
    <div id="answeredList"></div>
  </section>

  <!-- FULL -->
  <section id="tab-full" class="hidden">
    <div class="empty"><a href="full.html" style="color:var(--accent)">Abrir o Scanner Full →</a></div>
  </section>

  <!-- RESULTADO (tela cheia após escanear) -->
  <section id="tab-result" class="hidden">
    <div id="resultContent"></div>
    <button class="btn btn-primary btn-rescan" onclick="voltarParaScanner()">📷 Escanear novamente</button>
  </section>
</main>

<nav class="tabbar" id="mainTabs">
  <button class="active" data-tab="scan" onclick="showTab('scan')" title="Escanear" aria-label="Escanear">📷</button>
  <button data-tab="questions" onclick="showTab('questions')" title="Perguntas" aria-label="Perguntas">❓</button>
  <button data-tab="full" onclick="location.href='full.html'" title="Scanner Full" aria-label="Scanner Full">🏬</button>
</nav>

<script>
const API = ""; // mesma origem (Vercel)

function showTab(t){
  document.querySelectorAll("#mainTabs button").forEach(x=>x.classList.toggle("active",x.dataset.tab===t));
  document.getElementById("tab-scan").classList.toggle("hidden",t!=="scan");
  document.getElementById("tab-questions").classList.toggle("hidden",t!=="questions");
  document.getElementById("tab-full").classList.toggle("hidden",t!=="full");
  document.getElementById("tab-result").classList.add("hidden");
  document.querySelector("header").classList.remove("hidden");
  document.getElementById("mainTabs").classList.remove("hidden");
  if(t==="questions") loadQuestions();
}

function showResultView(){
  document.querySelector("header").classList.add("hidden");
  document.getElementById("mainTabs").classList.add("hidden");
  document.getElementById("tab-scan").classList.add("hidden");
  document.getElementById("tab-questions").classList.add("hidden");
  document.getElementById("tab-full").classList.add("hidden");
  document.getElementById("tab-result").classList.remove("hidden");
}

function voltarParaScanner(){
  showTab("scan");
  startScanner();
}

// ---------- Scanner ----------
let html5Qr=null, scanning=false, lastCode=null, lastAt=0;

async function startScanner(){
  if(scanning) return;
  document.getElementById("startBtn").style.display="none";
  html5Qr = new Html5Qrcode("reader");
  scanning=true;
  try{
    await html5Qr.start(
      {facingMode:"environment"},
      {fps:10, qrbox:{width:240,height:240}},
      onScan,
      ()=>{}
    );
  }catch(e){
    document.getElementById("scanHint").innerHTML="Não consegui abrir a câmera. Verifique a permissão do navegador. ("+e+")";
    scanning=false;
    document.getElementById("startBtn").style.display="block";
  }
}

async function stopScanner(){
  if(html5Qr && scanning){
    try{ await html5Qr.stop(); }catch(e){}
    scanning=false;
  }
}

function onScan(text){
  const now=Date.now();
  if(text===lastCode && now-lastAt<3000) return; // debounce do mesmo QR
  lastCode=text; lastAt=now;
  if(navigator.vibrate) navigator.vibrate(60);
  lookup(text);
}

async function lookup(qr){
  const box=document.getElementById("result");
  box.innerHTML='<div class="result">Consultando…</div>';
  try{
    const r=await fetch(API+"/api/lookup?qr="+encodeURIComponent(qr));
    const d=await r.json();
    if(!d.ok){ box.innerHTML='<div class="result err">⚠️ '+(d.error||"Erro")+'</div>'; return; }
    box.innerHTML="";
    await stopScanner();
    renderResult(d);
    showResultView();
  }catch(e){
    box.innerHTML='<div class="result err">Falha de conexão: '+e.message+'</div>';
  }
}

function badgeClass(tipo){
  if(tipo && tipo.startsWith("Flex")) return "Flex";
  if(tipo && tipo.startsWith("Agência")) return "Agência";
  if(tipo==="Full") return "Full";
  return "Full";
}

function renderResult(d){
  const it=d.itens && d.itens[0] || {};
  const extra=(d.itens||[]).slice(1).map(x=>`<div class="row"><span>${x.title}</span><span class="qtd">×${x.quantity}</span></div>`).join("");
  const totalQtd=(d.itens||[]).reduce((s,x)=>s+(x.quantity||0),0) || (it.quantity||0);
  const alerta=totalQtd>1
    ? `<div class="qty-alert">⚠️ ATENÇÃO: ${totalQtd} UNIDADES NESTE PEDIDO ⚠️</div>`
    : "";
  const fotos=(d.itens||[]).filter(x=>x.foto).map(x=>
    `<img class="foto-produto" src="${x.foto}" alt="${(x.title||"").replace(/"/g,"")}">`
  ).join("");
  document.getElementById("resultContent").innerHTML=`
    ${alerta}
    ${fotos?`<div class="fotos-row">${fotos}</div>`:""}
    <div class="result">
      <span class="badge ${badgeClass(d.tipo)}">${d.tipo}</span>
      <div class="prod">${it.title || "(produto não identificado)"}</div>
      <span class="qtd">Qtd: ${it.quantity ?? "?"}</span>
      ${it.variation?`<div class="meta" style="color:var(--muted);margin-top:6px">${it.variation}</div>`:""}
      ${extra}
      <div class="row"><span class="k">Destinatário</span><span>${d.destinatario||"—"}</span></div>
      <div class="row"><span class="k">Endereço</span><span>${d.endereco||"—"}</span></div>
      <div class="row"><span class="k">Bairro</span><span>${d.bairro||"—"}</span></div>
      <div class="row"><span class="k">Complemento</span><span>${d.complemento||"—"}</span></div>
      <div class="row"><span class="k">Envio</span><span>#${d.shipment_id}</span></div>
    </div>`;
}

// ---------- Perguntas ----------
function renderAnswered(list){
  const wrap=document.getElementById("answeredList");
  document.getElementById("answeredCount").textContent="Respondidas ("+list.length+")";
  if(!list.length){ wrap.innerHTML='<div class="empty">Nenhuma pergunta respondida ainda.</div>'; return; }
  wrap.innerHTML=list.map(q=>{
    const data=q.data?new Date(q.data).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"";
    const dataResp=q.respondida_em?new Date(q.respondida_em).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"";
    return `
      <div class="qcard qcard-respondida">
        <div class="card-row">
          ${q.foto?`<img class="card-foto" src="${q.foto}" alt="">`:'<div class="card-foto card-foto-empty"></div>'}
          <div class="card-info">
            <p class="p">${q.produto||"Produto"}</p>
          </div>
        </div>
        <div class="texto">${q.texto||""}</div>
        <div class="data">Perguntado ${data}</div>
        <div class="resposta-enviada">${q.resposta||"(sem texto salvo)"}</div>
        <div class="data" style="margin-top:6px">Respondido ${dataResp}</div>
        ${q.permalink?`<a class="abrir" style="margin-top:8px" href="${q.permalink}" target="_blank" rel="noopener">Abrir no Mercado Livre ↗</a>`:""}
      </div>`;
  }).join("");
}

async function loadQuestions(){
  const wrap=document.getElementById("questionsList");
  wrap.innerHTML='<div class="empty">Carregando… (a 1ª vez pode demorar alguns segundos pra gerar os rascunhos)</div>';
  try{
    const r=await fetch(API+"/api/questions");
    const d=await r.json();
    if(!d.ok){ wrap.innerHTML='<div class="empty">Erro: '+d.error+'</div>'; return; }
    const questions=d.pendentes||[];
    document.getElementById("questionsCount").textContent=questions.length+" pergunta(s) sem resposta";
    renderAnswered(d.respondidas||[]);
    if(!questions.length){ wrap.innerHTML='<div class="empty">Nenhuma pergunta pendente 🎉</div>'; return; }
    wrap.innerHTML=questions.map(q=>{
      const data=q.data?new Date(q.data).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"";
      const placeholder=q.rascunho?"":"Não consegui gerar o rascunho automático — escreva a resposta aqui.";
      const attrs=[
        `data-qid="${q.question_id}"`,
        `data-item="${q.item_id||''}"`,
        `data-produto="${(q.produto||'').replace(/"/g,'&quot;')}"`,
        `data-pergunta="${(q.texto||'').replace(/"/g,'&quot;')}"`,
      ].join(" ");
      return `
        <div class="qcard" ${attrs}>
          <div class="card-row">
            ${q.foto?`<img class="card-foto" src="${q.foto}" alt="">`:'<div class="card-foto card-foto-empty"></div>'}
            <div class="card-info">
              <p class="p">${q.produto||"Produto"}</p>
            </div>
          </div>
          <div class="texto">${q.texto||""}</div>
          <div class="data">${data}</div>
          ${q.anuncio_removido?'<div class="aviso-removido">⚠️ O anúncio dessa pergunta foi removido do Mercado Livre — não é possível responder (o próprio ML bloqueia).</div>':""}
          <textarea class="rascunho" placeholder="${placeholder}" ${q.anuncio_removido?"disabled":""}>${q.rascunho||""}</textarea>
          <div class="acoes">
            ${q.anuncio_removido
              ?'<button class="btn btn-primary btn-enviar" disabled style="opacity:.4;cursor:not-allowed">Não é possível enviar</button>'
              :`<button class="btn btn-primary btn-enviar" onclick="enviarResposta(${q.question_id})">Enviar resposta</button>`}
            <button class="btn-regenerar" onclick="regenerarRascunho(${q.question_id})" title="Gerar outro rascunho">↻</button>
          </div>
          ${q.permalink?`<a class="abrir" style="margin-top:8px" href="${q.permalink}" target="_blank" rel="noopener">Abrir no Mercado Livre ↗</a>`:""}
        </div>`;
    }).join("");
  }catch(e){ wrap.innerHTML='<div class="empty">Falha: '+e.message+'</div>'; }
}

async function enviarResposta(qid){
  const card=document.querySelector(`.qcard[data-qid="${qid}"]`);
  if(!card) return;
  const textarea=card.querySelector(".rascunho");
  const texto=textarea.value.trim();
  if(!texto){ alert("Escreva (ou espere gerar) a resposta antes de enviar."); return; }
  if(!confirm("Enviar essa resposta pro cliente no Mercado Livre?")) return;
  const btn=card.querySelector(".btn-enviar");
  const original=btn.textContent;
  btn.disabled=true; btn.textContent="Enviando…";
  try{
    const r=await fetch(API+"/api/answer",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({question_id:qid, texto})
    });
    const d=await r.json();
    if(!d.ok){ alert("Erro ao enviar: "+(d.error||"falha desconhecida")); btn.disabled=false; btn.textContent=original; return; }
    card.classList.add("enviada");
    textarea.disabled=true;
    btn.textContent="Enviada ✓";
    setTimeout(()=>{ loadQuestions(); },1000);
  }catch(e){
    alert("Falha de conexão: "+e.message);
    btn.disabled=false; btn.textContent=original;
  }
}

async function regenerarRascunho(qid){
  const card=document.querySelector(`.qcard[data-qid="${qid}"]`);
  if(!card) return;
  const textarea=card.querySelector(".rascunho");
  const btn=card.querySelector(".btn-regenerar");
  btn.disabled=true; const original=btn.textContent; btn.textContent="…";
  try{
    const r=await fetch(API+"/api/questions",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        question_id:qid,
        item_id:card.dataset.item,
        produto:card.dataset.produto,
        pergunta:card.dataset.pergunta,
      })
    });
    const d=await r.json();
    if(!d.ok){ alert("Erro ao gerar novo rascunho: "+(d.error||"")); }
    else{ textarea.value=d.rascunho||""; }
  }catch(e){ alert("Falha de conexão: "+e.message); }
  btn.disabled=false; btn.textContent=original;
}

// ---------- Início automático ----------
// Ao abrir o app (ou via ícone da tela inicial / QR da bancada), já liga a câmera.
// No iPhone o Safari pode exigir 1 toque no botão "Ativar câmera" na 1ª vez — nas
// próximas, como a permissão já foi dada, costuma ligar direto.
window.addEventListener("load", () => {
  if (!document.getElementById("tab-scan").classList.contains("hidden")) {
    startScanner();
  }
});
</script>
