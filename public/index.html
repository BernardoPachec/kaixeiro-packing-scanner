<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#000000" />
<title>Kaixeiro · Bancada de Envios</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="Kaixeiro Envios" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  /* Paleta oficial Kaixeiro Digital: apenas preto, branco e amarelo (#F3AA07).
     --danger é a única exceção deliberada, fora da paleta: alerta de quantidade
     precisa ser vermelho pra segurança, ver conversa com o Bernardo. */
  :root{
    --bg:#000000; --card:#0d0d0d; --card2:#1a1a1a; --line:rgba(255,255,255,.14);
    --txt:#ffffff; --muted:rgba(255,255,255,.55); --accent:#F3AA07;
    --danger:#dc2626;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background-color:var(--bg);color:var(--txt);font-weight:400;
    background-image:
      linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
    background-size:32px 32px;
    min-height:100vh;
  }
  header{position:sticky;top:0;z-index:10;background:#000000ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 16px}
  .brand-logo{height:46px;width:auto;display:block}
  main{padding:16px;padding-bottom:110px;max-width:640px;margin:0 auto}
  .hidden{display:none !important}

  /* Barra de abas flutuante estilo iOS: fixa embaixo, translúcida com blur, só ícones */
  .tabbar{
    position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));
    transform:translateX(-50%);z-index:20;display:flex;gap:4px;
    background:rgba(24,24,24,.6);backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border:1px solid rgba(255,255,255,.14);padding:7px;border-radius:26px;
    box-shadow:0 8px 28px rgba(0,0,0,.45);
  }
  .tabbar button{
    border:none;background:transparent;color:var(--muted);
    font-size:22px;line-height:1;width:50px;height:50px;border-radius:19px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:background .2s ease,color .2s ease,transform .15s ease;
  }
  .tabbar button:active{transform:scale(.92)}
  .tabbar button.active{background:var(--accent);color:#000;box-shadow:0 2px 8px rgba(0,0,0,.35)}

  /* Botões estilo iOS: cantos bem arredondados, feedback de toque via escala */
  .btn{
    display:block;width:100%;padding:15px;border-radius:16px;border:none;
    font-family:inherit;font-weight:600;font-size:16px;cursor:pointer;
    transition:transform .15s cubic-bezier(.4,0,.2,1), opacity .15s ease;
  }
  .btn:active{transform:scale(.97);opacity:.8}
  .btn-primary{background:var(--accent);color:#000}
  .btn-ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
  .btn:disabled{opacity:.5;cursor:default}

  /* Scanner */
  #reader{width:100%;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
  .scan-hint{color:var(--muted);text-align:center;font-size:14px;margin:12px 0}
  .result{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;animation:pop .18s ease}
  @keyframes pop{from{transform:scale(.97);opacity:.3}to{transform:scale(1);opacity:1}}
  .badge{display:inline-block;padding:6px 14px;border-radius:999px;font-weight:800;font-size:15px}
  .badge.Flex{background:var(--accent);color:#000}
  .badge.Agência{background:#fff;color:#000}
  .badge.Full{background:#000;color:#fff;border:1px solid rgba(255,255,255,.4)}
  .prod{font-size:22px;font-weight:700;line-height:1.25;margin:14px 0 4px}
  .qtd{display:inline-block;background:var(--accent);color:#000;font-weight:800;border-radius:10px;padding:4px 12px;font-size:16px}
  .row{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
  .row .k{color:var(--muted)}
  .err{background:#3a1420;border:1px solid #7f2436;color:#ffd5dd}

  .card-row{display:flex;gap:12px;align-items:center}
  .card-foto{width:52px;height:52px;border-radius:12px;object-fit:contain;background:#fff;flex-shrink:0;border:1px solid var(--line)}
  .card-foto-empty{background:var(--card2)}
  .card-info{flex:1;min-width:0}
  .card-info .p{font-weight:600;font-size:15px;margin:0 0 4px}
  .card-info .meta{color:var(--muted);font-size:13px}
  .empty{color:var(--muted);font-size:13px;font-style:italic;padding:6px 2px}
  .refresh{color:var(--accent);background:none;border:none;font-weight:700;cursor:pointer;font-size:14px}

  /* Página de resultado */
  #tab-result{padding:16px;max-width:640px;margin:0 auto}
  .fotos-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:4px 0 16px}
  .foto-produto{width:140px;height:140px;border-radius:50%;object-fit:contain;object-position:center;background:#fff;display:block;border:3px solid var(--line);padding:6px}
  .qty-alert{background:var(--danger);color:#fff;font-weight:900;font-size:17px;text-align:center;padding:16px;border-radius:14px;letter-spacing:.3px;margin-bottom:14px;animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.55)}50%{box-shadow:0 0 0 12px rgba(220,38,38,0)}}
  .btn-rescan{margin-top:18px;font-size:17px;padding:16px}

  /* Conferência do pedido Flex/Agência (mesma base do Scanner Full) */
  .ja-embalado{background:var(--danger);color:#fff;font-weight:900;font-size:22px;text-align:center;padding:16px;border-radius:14px;margin-bottom:14px;letter-spacing:.5px}
  .ja-embalado span{font-weight:600;font-size:15px}
  .pedido-prod{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
  .pedido-prod.pronto{border-color:#3ecf6e}
  .foto-prod{width:84px;height:84px;border-radius:14px;object-fit:contain;background:#fff;flex-shrink:0;border:1px solid var(--line)}
  .qtd-grande{flex:none;background:var(--accent);color:#000;font-weight:900;font-size:30px;border-radius:14px;padding:6px 12px;text-align:center;line-height:1}
  .qtd-grande small{display:block;font-size:11px;font-weight:700}
  .bip{margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:12px}
  .bip.ok{border-color:#3ecf6e;background:rgba(62,207,110,.08)}
  .bip-top{display:flex;justify-content:space-between;font-size:16px}
  .bip.ok .bip-top{color:#3ecf6e}
  .barra{height:6px;background:#222;border-radius:4px;margin-top:8px;overflow:hidden}
  .barra i{display:block;height:100%;background:var(--accent)}
  .bip.ok .barra i{background:#3ecf6e}
  .check{margin-top:14px}
  .lbl{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  .check-item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#000;border:1px solid var(--line);color:#fff;padding:14px;border-radius:14px;font-weight:700;font-size:20px;line-height:1.25;font-family:inherit;margin-top:8px;cursor:pointer}
  .check-item .box{flex:none;width:34px;height:34px;border:2px solid var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#000}
  .check-item.on{border-color:#3ecf6e;background:rgba(62,207,110,.1);color:#3ecf6e}
  .check-item.on .box{background:#3ecf6e;border-color:#3ecf6e}
  .btn-big{margin-top:18px;font-size:19px;padding:18px;font-weight:800}
  .ensinar{margin-top:8px;text-align:left;font-weight:500;font-size:15px}
  .ean-erro{margin-top:16px;background:#3a1420;border:1px solid #7f2436;color:#ffd5dd;border-radius:14px;padding:14px;font-size:15px}
  .link{color:var(--accent);font-weight:700;font-size:14px;text-decoration:none}
  .mini{color:rgba(255,255,255,.4);font-size:12px;text-decoration:underline}
  .modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;padding:14px}
  .mbox{width:100%;max-width:460px;max-height:calc(100vh - 28px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:18px}
  .mhead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:800}
  .mhead button{background:none;border:0;color:var(--muted);font-size:26px;cursor:pointer;line-height:1}
  .mbody{padding:16px;display:flex;flex-direction:column;gap:12px}
  .minput{width:100%;height:50px;background:#000;border:1px solid var(--line);border-radius:12px;color:#fff;padding:0 12px;font-size:16px;font-family:inherit;outline:0}
  .minput:focus{border-color:var(--accent)}
  .eancam{min-height:200px;background:#111}
  .eancam video{width:100% !important;display:block}
  .ean-status{font-size:15px;line-height:1.5;border-radius:12px;padding:10px 12px;background:var(--card2)}
  .ean-status.ok{color:#3ecf6e}
  .ean-status.erro{background:#3a1420;color:#ffd5dd}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:40;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 18px;font-size:14px;max-width:calc(100vw - 32px)}
</style>
</head>

<main>
  <!-- SCANNER (QR da etiqueta Flex / Agência) -->
  <section id="tab-scan">
    <div id="reader"></div>
    <p class="scan-hint" id="scanHint">Aponte a câmera para o QR da etiqueta.</p>
    <button class="btn btn-ghost" id="startBtn" onclick="startScanner()">Ativar câmera</button>
    <div id="result"></div>
  </section>

  <!-- RESULTADO + CONFERÊNCIA (tela cheia após escanear) -->
  <section id="tab-result" class="hidden">
    <div id="resultContent"></div>
    <button class="btn btn-ghost btn-rescan" onclick="voltarParaScanner()">📷 Escanear outra etiqueta</button>
  </section>
</main>

<nav class="tabbar" id="mainTabs">
  <button class="active" data-tab="scan" onclick="showTab('scan')" title="Bancada Flex / Agência" aria-label="Bancada Flex / Agência">📷</button>
  <button data-tab="full" onclick="location.href='full.html'" title="Scanner Full" aria-label="Scanner Full">🏬</button>
</nav>

<!-- Bipar produtos (EAN/SKU) do pedido -->
<div class="modal hidden" id="eanModal">
  <div class="mbox">
    <div class="mhead"><span>Bipar produtos</span><button onclick="fecharEan()" aria-label="Fechar">×</button></div>
    <div id="eanCam" class="eancam"></div>
    <div class="mbody">
      <div id="eanStatus" class="ean-status"></div>
      <form style="display:flex;gap:8px" onsubmit="event.preventDefault();lerManual()">
        <input id="eanManual" class="minput" placeholder="Ou digite / use o leitor USB" autocomplete="off" inputmode="numeric">
        <button class="btn btn-primary" style="width:auto;padding:0 18px" type="submit">Ler</button>
      </form>
    </div>
  </div>
</div>

<!-- Alterar checklist do anúncio -->
<div class="modal hidden" id="ckModal">
  <div class="mbox">
    <div class="mhead"><span>Alterar checklist</span><button onclick="esconder('ckModal')" aria-label="Fechar">×</button></div>
    <div class="mbody" id="ckBody"></div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>

<script>
const API = ""; // mesma origem (Vercel)
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const mostrar = (id) => $(id).classList.remove("hidden");
const esconder = (id) => $(id).classList.add("hidden");
function toast(msg, ms = 2600) { const t = $("toast"); t.textContent = msg; mostrar("toast"); clearTimeout(toast._t); toast._t = setTimeout(() => esconder("toast"), ms); }
let actx;
function beep(ok) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = ok ? 1250 : 220; o.type = ok ? "sine" : "square";
    g.gain.value = 0.08; o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + (ok ? 0.12 : 0.35));
  } catch {}
  if (navigator.vibrate) navigator.vibrate(ok ? 60 : [120, 60, 120]);
}

function showTab(t){
  document.querySelectorAll("#mainTabs button").forEach(x=>x.classList.toggle("active",x.dataset.tab===t));
  $("tab-scan").classList.toggle("hidden",t!=="scan");
  $("tab-result").classList.add("hidden");
  document.querySelector("header").classList.remove("hidden");
  $("mainTabs").classList.remove("hidden");
}
function showResultView(){
  document.querySelector("header").classList.add("hidden");
  $("mainTabs").classList.add("hidden");
  $("tab-scan").classList.add("hidden");
  $("tab-result").classList.remove("hidden");
  window.scrollTo(0, 0);
}
function voltarParaScanner(){
  P = null;
  showTab("scan");
  startScanner();
}

// ---------- Scanner do QR da etiqueta ----------
let html5Qr=null, scanning=false, lastCode=null, lastAt=0;

async function startScanner(){
  if(scanning) return;
  $("startBtn").style.display="none";
  html5Qr = html5Qr || new Html5Qrcode("reader");
  scanning=true;
  try{
    await html5Qr.start({facingMode:"environment"},{fps:10, qrbox:{width:240,height:240}},onScan,()=>{});
  }catch(e){
    $("scanHint").innerHTML="Não consegui abrir a câmera. Verifique a permissão do navegador. ("+esc(e)+")";
    scanning=false;
    $("startBtn").style.display="block";
  }
}
async function stopScanner(){
  if(html5Qr && scanning){ try{ await html5Qr.stop(); }catch(e){} scanning=false; }
}
function onScan(text){
  const now=Date.now();
  if(text===lastCode && now-lastAt<3000) return; // debounce do mesmo QR
  lastCode=text; lastAt=now;
  if(navigator.vibrate) navigator.vibrate(60);
  lookup(text);
}

async function lookup(qr){
  const box=$("result");
  box.innerHTML='<div class="result">Consultando…</div>';
  try{
    const r=await fetch(API+"/api/lookup?qr="+encodeURIComponent(qr));
    const d=await r.json();
    if(!d.ok){ box.innerHTML='<div class="result err">⚠️ '+esc(d.error||"Erro")+'</div>'; return; }
    box.innerHTML="";
    await stopScanner();
    abrirPedido(d);
    showResultView();
  }catch(e){
    box.innerHTML='<div class="result err">Falha de conexão: '+esc(e.message)+'</div>';
  }
}

function badgeClass(tipo){
  if(tipo && tipo.startsWith("Flex")) return "Flex";
  if(tipo && tipo.startsWith("Agência")) return "Agência";
  return "Full";
}

// ---------- Conferência do pedido (mesma base do Scanner Full) ----------
// Cada produto do pedido: bipar o código de barras de CADA unidade (EAN do anúncio/variação
// ou o SKU) e marcar o checklist do anúncio (o mesmo do Scanner Full). O botão "Marcar como
// embalado" só libera com tudo bipado e marcado; depois escolhe quem embalou.
const CONFERIR_ANUNCIO = "Conferi no anúncio o que vai neste pacote";
let P = null; // pedido aberto

const norm = (s) => String(s || "").trim().toUpperCase().replace(/\s+/g, "");
const digits = (s) => s.replace(/^0+/, "");
function casaProduto(it, raw) {
  const c = norm(raw);
  if (!c) return false;
  if (/^\d+$/.test(c)) return (it.gtins || []).some((g) => digits(norm(g)) === digits(c));
  return !!it.sku && norm(it.sku) === c;
}
const temCodigo = (it) => (it.gtins || []).length > 0;
const passosDe = (it) => it.checklist ? (it.checklist.passos || []) : [CONFERIR_ANUNCIO];

function abrirPedido(d) {
  P = { d, lidos: d.itens.map(() => []), semCodigo: d.itens.map(() => false), feitos: d.itens.map(() => new Set()), erro: null };
  renderPedido();
}

// Bipar é só para conferir se é o produto certo (não trava o botão): o pacote fica pronto com
// o checklist marcado. (Bernardo, 21/10/2026)
function itemPronto(k) {
  const it = P.d.itens[k];
  return passosDe(it).every((_, j) => P.feitos[k].has(j));
}

function renderPedido() {
  const d = P.d;
  const totalQtd = d.itens.reduce((s, x) => s + (x.quantity || 0), 0);
  const tudo = d.itens.every((_, k) => itemPronto(k));
  const emb = d.embalagem;
  const quando = emb ? new Date(emb.criado_em).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
  $("resultContent").innerHTML = `
    ${emb ? `<div class="ja-embalado">⛔ JÁ EMBALADO<br><span>${emb.responsavel && emb.responsavel !== "não informado" ? `por ${esc(emb.responsavel)} ` : ""}em ${quando}</span></div>` : ""}
    ${totalQtd > 1 ? `<div class="qty-alert">⚠️ ATENÇÃO: ${totalQtd} UNIDADES NESTE PEDIDO ⚠️</div>` : ""}
    <div class="result" style="margin-top:0">
      <span class="badge ${badgeClass(d.tipo)}">${esc(d.tipo)}</span>
      <div class="row" style="border-top:0;margin-top:10px"><span class="k">Destinatário</span><span>${esc(d.destinatario || "—")}</span></div>
      <div class="row"><span class="k">Endereço</span><span>${esc(d.endereco || "—")}</span></div>
      <div class="row"><span class="k">Bairro</span><span>${esc(d.bairro || "—")}</span></div>
      <div class="row"><span class="k">Complemento</span><span>${esc(d.complemento || "—")}</span></div>
      <div class="row"><span class="k">Envio</span><span>#${esc(d.shipment_id)}</span></div>
    </div>

    ${d.itens.map((it, k) => produtoHtml(it, k)).join("")}

    ${P.erro ? `<div class="ean-erro">${P.erro}</div>` : ""}

    <button class="btn btn-ghost btn-big" onclick="abrirEan()">📷 Bipar produtos</button>
    <button class="btn btn-primary btn-big" style="margin-top:12px" ${tudo ? "" : "disabled"} onclick="marcarEmbalado()">${emb ? "Já embalado · marcar de novo" : "Marcar como embalado"}</button>
    ${tudo ? "" : `<p class="scan-hint">Marque o checklist de cada produto para liberar. Bipar é opcional, para conferir se é o produto certo.</p>`}`;
}

function produtoHtml(it, k) {
  const qtd = it.quantity || 1, lidos = P.lidos[k].length, ok = P.semCodigo[k] || lidos >= qtd;
  const passos = passosDe(it), ck = it.checklist;
  const titulo = !ck ? "Sem checklist cadastrado" : !passos.length ? "Produto simples" : "O que vai no pacote";
  return `
  <div class="pedido-prod ${itemPronto(k) ? "pronto" : ""}">
    <div class="card-row" style="align-items:flex-start">
      ${it.foto ? `<img class="foto-prod" src="${esc(it.foto)}" alt="">` : '<div class="foto-prod card-foto-empty"></div>'}
      <div class="card-info">
        <div class="prod" style="margin:0 0 4px;font-size:19px">${esc(it.title || "(produto não identificado)")}</div>
        ${it.variation ? `<div class="meta">${esc(it.variation)}</div>` : ""}
        <div class="meta">SKU ${esc(it.sku || "—")} · EAN ${esc((it.gtins || []).join(", ") || "—")}</div>
      </div>
      <span class="qtd-grande">${qtd}<small>un.</small></span>
    </div>

    <div class="bip ${ok ? "ok" : ""}">
      ${temCodigo(it) ? `
        <div class="bip-top"><b>${P.semCodigo[k] ? "Conferido no olho" : `Bipado ${Math.min(lidos, qtd)} de ${qtd}`}</b><span>${ok ? "✓" : ""}</span></div>
        <div class="barra"><i style="width:${Math.min(100, Math.round((P.semCodigo[k] ? qtd : lidos) / qtd * 100))}%"></i></div>`
      : `
        <div class="bip-top"><b>Ainda não tenho o código de barras deste produto</b></div>
        <p class="meta" style="margin:6px 0 0">Opcional: bipe uma unidade e a tela pergunta se o código é deste produto, para conferir nas próximas vezes.</p>`}
    </div>

    <div class="check">
      <div class="lbl" style="margin-bottom:8px">${titulo}</div>
      ${!ck ? `<p style="margin:0 0 10px;font-size:15px;line-height:1.4"><b style="color:var(--accent)">Não tenho informação sobre o checklist deste anúncio.</b> Abra o anúncio e confira o que vai junto antes de embalar.</p>
        ${it.permalink ? `<a class="link" href="${esc(it.permalink)}" target="_blank" rel="noopener">Ver anúncio ${esc(it.item_id || "")} ↗</a>` : ""}` : ""}
      ${ck && !ck.revisado && passos.length ? `<p class="meta" style="color:var(--accent);margin:0 0 8px">Montado a partir da descrição do anúncio: confira.</p>` : ""}
      ${passos.length ? passos.map((p, j) => `
        <button class="check-item ${P.feitos[k].has(j) ? "on" : ""}" onclick="togglePasso(${k},${j})">
          <span class="box">${P.feitos[k].has(j) ? "✓" : ""}</span><span>${esc(p)}</span>
        </button>`).join("") : `<p style="margin:0;font-size:15px">Vai <b>só o produto</b> (cadastrado por vocês). <b style="color:var(--accent)">Não colocar</b> flanela, aplicador nem outro item.</p>`}
      <div style="text-align:right;margin-top:6px"><a class="mini" href="javascript:editChecklist(${k})">alterar checklist</a></div>
    </div>
  </div>`;
}

function togglePasso(k, j) {
  const s = P.feitos[k]; s.has(j) ? s.delete(j) : s.add(j);
  const y = window.scrollY; renderPedido(); window.scrollTo(0, y);
}

// Uma leitura vale para o produto do pedido cujo código bate e que ainda tem unidade a bipar.
function registrarLeitura(raw) {
  const code = norm(raw);
  if (!code || !P) return;
  const ks = P.d.itens.map((it, k) => k).filter((k) => casaProduto(P.d.itens[k], code));
  if (!ks.length) {
    beep(false);
    // Pode ser o produto certo com o código ainda não cadastrado (anúncio sem GTIN no ML):
    // oferece "é deste produto" para quem ainda tem unidade a bipar.
    const pendentes = !/^\d{8,14}$/.test(code) ? [] :
      P.d.itens.map((it, i) => i).filter((i) => !P.semCodigo[i] && P.lidos[i].length < (P.d.itens[i].quantity || 1));
    P.erro = `❌ O código <b>${esc(code)}</b> não está cadastrado em nenhum produto deste pedido.`
      + (pendentes.length ? `<br>Se você está com o produto certo na mão, toque nele para cadastrar o código:`
        + pendentes.map((i) => `<button class="btn btn-ghost ensinar" onclick="ensinarCodigo(${i},'${code}')">É o código de: <b>${esc(P.d.itens[i].title)}</b></button>`).join("")
        + `<br><span class="meta">Se não for, separe essa unidade: é outro produto.</span>` : " Separe essa unidade.");
    statusEan(P.erro, true);
    return renderPedido();
  }
  const k = ks.find((x) => P.lidos[x].length < (P.d.itens[x].quantity || 1));
  if (k == null) {
    beep(false);
    const it = P.d.itens[ks[0]];
    P.erro = `❌ Já bipou as ${it.quantity || 1} unidade(s) de <b>${esc(it.title)}</b>. Essa é a mais: NÃO coloque no pacote.`;
    statusEan(P.erro, true);
    return renderPedido();
  }
  P.lidos[k].push(code); P.erro = null; beep(true);
  const it = P.d.itens[k];
  statusEan(`✓ ${esc(it.title)} · ${P.lidos[k].length} de ${it.quantity || 1}`, false);
  renderPedido();
  if (P.d.itens.every((x, i) => !temCodigo(x) || P.semCodigo[i] || P.lidos[i].length >= (x.quantity || 1))) setTimeout(fecharEan, 600);
}

// "Este código é deste produto": grava o EAN da embalagem para o produto (pelo SKU e pelo MLB),
// vale daqui pra frente no Flex e no Scanner Full, e já conta esta unidade.
async function ensinarCodigo(k, code) {
  const it = P.d.itens[k];
  if (!/^\d{8,14}$/.test(code)) return toast("Só dá para cadastrar código de barras numérico (EAN).", 4000);
  if (!confirm(`O código ${code} é mesmo da embalagem de:\n\n${it.title}\n\nEle vai valer para este produto daqui pra frente.`)) return;
  try {
    const r = await fetch(API + "/api/flex", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ acao: "codigo", codigo: code, sku: it.sku, item_id: it.item_id, titulo: it.title }) });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || "Falha");
    it.gtins = [...new Set([...(it.gtins || []), code])];
    P.erro = null;
    toast("Código cadastrado para este produto.");
    registrarLeitura(code);
  } catch (e) { toast("Não cadastrou: " + e.message, 5000); }
}

// ---------- Câmera para EAN ----------
let eanCam = null, eanOn = false, eanLast = "", eanAt = 0;
function statusEan(html, erro) { const s = $("eanStatus"); if (s) { s.innerHTML = html; s.className = "ean-status " + (erro ? "erro" : "ok"); } }
async function abrirEan() {
  const falta = P.d.itens.map((it, k) => temCodigo(it) && !P.semCodigo[k] ? `${esc(it.title)}: ${P.lidos[k].length}/${it.quantity || 1}` : null).filter(Boolean);
  statusEan(falta.length ? "Bipe o código de barras de cada unidade.<br>" + falta.join("<br>") : "Nenhum produto com código para bipar.", false);
  $("eanManual").value = "";
  mostrar("eanModal");
  setTimeout(() => $("eanManual").focus({ preventScroll: true }), 50);
  if (eanOn) return;
  try {
    const F = Html5QrcodeSupportedFormats;
    eanCam = eanCam || new Html5Qrcode("eanCam", { verbose: false,
      formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.ITF],
      experimentalFeatures: { useBarCodeDetectorIfSupported: true } });
    eanOn = true;
    await eanCam.start({ facingMode: "environment" },
      { fps: 12, qrbox: (w, h) => ({ width: Math.floor(w * 0.85), height: Math.floor(Math.min(h * 0.5, 160)) }) },
      (t) => { const n = Date.now(); if (t === eanLast && n - eanAt < 1500) return; eanLast = t; eanAt = n; registrarLeitura(t); }, () => {});
  } catch (e) {
    eanOn = false;
    statusEan("Câmera indisponível: digite o código ou use o leitor USB.", true);
  }
}
async function fecharEan() {
  esconder("eanModal");
  if (eanCam && eanOn) { try { await eanCam.stop(); } catch {} eanOn = false; }
}
function lerManual() { const v = $("eanManual").value.trim(); $("eanManual").value = ""; if (v) registrarLeitura(v); }

// Leitor USB/Bluetooth com o pedido aberto e o modal fechado: digita rápido e dá Enter.
let kb = "", kbAt = 0;
document.addEventListener("keydown", (ev) => {
  if (!P || $("tab-result").classList.contains("hidden")) return;
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || "")) return;
  const now = Date.now();
  if (now - kbAt > 80) kb = "";
  kbAt = now;
  if (ev.key === "Enter") { const c = kb; kb = ""; if (c.length >= 4) registrarLeitura(c); return; }
  if (ev.key.length === 1) kb += ev.key;
});

// ---------- Marcar como embalado ----------
async function marcarEmbalado() {
  if (P.d.embalagem && !confirm("Este pedido JÁ FOI EMBALADO. Marcar de novo mesmo assim?")) return;
  const d = P.d, btn = document.querySelector(".btn.btn-primary.btn-big");
  if (btn) { btn.disabled = true; btn.textContent = "Salvando…"; }
  try {
    const r = await fetch(API + "/api/flex", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({
      acao: "embalar", shipment_id: d.shipment_id, order_id: d.order_id, tipo: d.tipo,
      itens: d.itens.map((it, k) => ({ item_id: it.item_id, titulo: it.title, quantidade: it.quantity, bipados: P.lidos[k].length,
        codigos: P.lidos[k], sem_codigo: P.semCodigo[k], passos: passosDe(it).filter((_, j) => P.feitos[k].has(j)) })),
    }) });
    const res = await r.json();
    if (!res.ok) throw new Error(res.error || "Falha ao salvar");
    beep(true);
    toast(`Pedido #${d.shipment_id} marcado como embalado.`, 3000);
    voltarParaScanner();
  } catch (e) { toast("Não salvou: " + e.message, 5000); renderPedido(); }
}

// ---------- Alterar checklist (o mesmo do Scanner Full, por anúncio) ----------
function editChecklist(k) {
  const it = P.d.itens[k];
  $("ckBody").innerHTML = `
    <p style="margin:0;font-size:14px;color:var(--muted)">O que vai no pacote de <b style="color:#fff">${esc(it.title)}</b>, um item por linha. Vale para este anúncio aqui e no Scanner Full. Lista vazia = vai só o produto.</p>
    <textarea id="ckText" class="minput" style="height:180px;padding:10px;font-size:16px;line-height:1.5" placeholder="Ex.: 1x Cera 100 g&#10;1x Aplicador de espuma&#10;1x Flanela cinza 30x30">${esc((it.checklist?.passos || []).join("\n"))}</textarea>
    <button class="btn btn-primary" id="ckGo" onclick="salvarChecklist(${k})">Salvar checklist</button>`;
  mostrar("ckModal");
}
async function salvarChecklist(k) {
  const it = P.d.itens[k], btn = $("ckGo");
  btn.disabled = true; btn.textContent = "Salvando…";
  const passos = $("ckText").value.split("\n").map((s) => s.trim()).filter(Boolean);
  const qtd = (p) => (p.match(/^(\d+)x\s/) || [])[1];
  const itens = passos.filter(qtd);
  const kit = itens.length > 1 || itens.some((p) => Number(qtd(p)) > 1);
  try {
    const r = await fetch(API + "/api/full", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({
      acao: "checklist", inv: it.checklist_chave, item_id: it.item_id, sku: it.sku, titulo: it.title, kit, passos }) });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || "Falha");
    it.checklist = d.checklist; P.feitos[k] = new Set();
    esconder("ckModal"); renderPedido(); toast("Checklist salvo para este anúncio.");
  } catch (e) { btn.disabled = false; btn.textContent = "Tentar de novo"; toast(e.message, 5000); }
}

// ---------- Início automático ----------
// Ao abrir o app (ou via ícone da tela inicial / QR da bancada), já liga a câmera.
window.addEventListener("load", () => {
  if (!$("tab-scan").classList.contains("hidden")) startScanner();
});
</script>
